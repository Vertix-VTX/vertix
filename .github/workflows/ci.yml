name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: "1.25.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout 15m

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"
      - run: cd proto && buf lint
      - run: cd proto && buf breaking --against 'https://github.com/vertix-network/vertix.git#branch=main,subdir=proto'
        continue-on-error: true

  genesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make validate-genesis

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build vertixd image
        run: docker build -t vertix-network/vertixd:local .
      - name: Run interchaintest ICS-20 suite
        working-directory: e2e
        run: go test ./... -timeout 30m -v

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Non-determinism simulation
        run: make test-sim-nondeterminism SIM_NUM_BLOCKS=30 SIM_BLOCK_SIZE=25
      - name: Full-app simulation (bounded)
        run: make test-sim-fullapp SIM_NUM_BLOCKS=30 SIM_BLOCK_SIZE=25
