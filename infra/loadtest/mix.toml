# Phase 9 module-realistic tx mix for vertix-testnet-2.
# Consumed by infra/loadtest/clients/txflood and scripts/testnet/v2/load-test.sh.
#
# When the v2 stack runs inside Docker, load-test.sh overrides grpc to founder1:9090
# and runs txflood on the vertix-testnet-v2 network (sentry RPC is loopback-only).

[run]
duration_sec = 600
ramp_rates = [50, 100, 150]
rpc = "http://localhost:26657"
grpc = "founder1:9090"
chain_id = "vertix-testnet-2"
fees = "5000uvtx"
gas = "400000"
gas_adjustment = 1.3

[mix]
bank_send = 0.70
oracle_submit = 0.20
rwa_register = 0.10

[accounts]
# Recovered or created by scripts/testnet/v2/load-test.sh; funded from genesis faucet.
bank_keys = ["loadtest1", "loadtest2", "loadtest3"]
oracle_keys = ["feeder1", "feeder2", "feeder3"]
rwa_keys = ["loadtest1", "loadtest2", "loadtest3"]
faucet_key = "faucet"

[oracle]
# feeder keyring name -> validator operator keyring name (founder gentx keys)
feeder_validators = { feeder1 = "founder1", feeder2 = "founder2", feeder3 = "founder3" }
default_pair = "BTC:USD"
default_price = "65000.00"

[rwa]
oracle_pair = "BTC:USD"
bond = "10000000000"
name_prefix = "loadtest"
