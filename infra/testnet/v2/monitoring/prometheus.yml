global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: cometbft
    metrics_path: /metrics
    static_configs:
      - targets:
          - founder1:26660
          - founder2:26660
          - founder3:26660
          - sentry1:26660
          - sentry2:26660
          - sentry3:26660
  - job_name: feeders
    metrics_path: /metrics
    static_configs:
      - targets:
          - feeder1:9200
          - feeder2:9200
          - feeder3:9200
