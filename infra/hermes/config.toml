[global]
log_level = "info"

[mode.clients]
enabled = true
refresh = true
misbehaviour = true
[mode.connections]
enabled = true
[mode.channels]
enabled = true
[mode.packets]
enabled = true
clear_interval = 100
clear_on_start = true
tx_confirmation = true

[telemetry]
enabled = true
host = "0.0.0.0"
port = 3001

[[chains]]
id = "vertix-devnet-1"
rpc_addr = "http://vertix-val1:26657"
grpc_addr = "http://vertix-val1:9090"
event_source = { mode = "push", url = "ws://vertix-val1:26657/websocket", batch_delay = "500ms" }
account_prefix = "vtx"
key_name = "relayer"
store_prefix = "ibc"
gas_price = { price = 0.025, denom = "uvtx" }
gas_multiplier = 1.3
trusting_period = "336h"
clock_drift = "10s"
max_block_time = "30s"

